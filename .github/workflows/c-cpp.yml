name: Build Byepervisor Reborn

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ps5-payload-dev/sdk:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Payload
        run: |
          make

      - name: Upload ELF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: byepervisor-elf
          path: |
            *.elf
            bin/*.elf
