name: Build Byepervisor Reborn

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup PS5 Payload SDK
        uses: PS5Dev/ps5-payload-sdk-action@v1

      - name: Build Payload
        run: |
          make

      - name: Upload ELF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: byepervisor-elf
          path: |
            *.elf
            bin/*.elf
